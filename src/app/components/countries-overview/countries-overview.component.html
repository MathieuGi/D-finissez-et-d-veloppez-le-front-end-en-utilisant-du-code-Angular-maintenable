<app-page-head class="head" [title]="titlePage" [indicators]="indicators()" />

@if (!countries().length) {
  <div class="placeholder">No data to display</div>
} @else {
  <app-pie-chart
    class="pie-chart"
    title="DashboardPieChart"
    [labels]="countryNames()"
    label="Medals"
    [data]="sumOfAllMedalsYears()"
    (elementClick)="onCountryClick($event)"
  />
}
