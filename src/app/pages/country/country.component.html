<div>
  <div>
    <div class="center">
      <app-page-title [title]="titlePage()" />
    </div>
    <div class="split">
      <app-chart-indicator title="Number of entries" [value]="totalEntries()" />
      <app-chart-indicator
        title="Total Number of medals"
        [value]="totalMedals()"
      />
      <app-chart-indicator
        title="Total Number of athletes"
        [value]="totalAthletes()"
      />
    </div>
  </div>
  @if (years().length && medals().length) {
    <app-bar-chart label="medals" [labels]="years()" [data]="medals()" />
  }
</div>
