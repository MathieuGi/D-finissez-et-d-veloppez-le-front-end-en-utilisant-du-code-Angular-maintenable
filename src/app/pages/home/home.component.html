@if (isLoading()) {
  <div class="placeholder">
    <ngx-spinner type="ball-scale-multiple" [fullScreen]="false"></ngx-spinner>
  </div>
} @else if (hasError()) {
  <div class="placeholder">
    {{ errorMessage() }}
  </div>
} @else if (countries.hasValue()) {
  <app-countries-overview [countries]="countries.value()" />
}
